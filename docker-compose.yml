version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-liptow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liptow_secret}
      POSTGRES_DB: ${POSTGRES_DB:-liptow_net}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-liptow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-liptow}:${POSTGRES_PASSWORD:-liptow_secret}@db:5432/${POSTGRES_DB:-liptow_net}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-please_change_this_secret_in_production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      STORAGE_ROOT: /app/storage
    volumes:
      - storage-data:/app/storage
    ports:
      - "3000:3000"

volumes:
  db-data:
  storage-data:
